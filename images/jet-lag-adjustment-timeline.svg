<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Jet lag adjustment timeline</title><desc id="d">Four steps for adapting to a new time zone: shift sleep gradually before travel when possible, follow destination time, time light exposure carefully, and keep a consistent local wake time.</desc><rect width="1000" height="420" rx="24" fill="#f5fbf9"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#174e4a">A gradual jet-lag adjustment plan</text><path d="M125 170H875" stroke="#a8d7ce" stroke-width="8" stroke-linecap="round"/><g><circle cx="125" cy="170" r="28" fill="#287f78"/><circle cx="375" cy="170" r="28" fill="#287f78"/><circle cx="625" cy="170" r="28" fill="#287f78"/><circle cx="875" cy="170" r="28" fill="#287f78"/></g><g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#174e4a" text-anchor="middle"><text x="125" y="225">Before travel</text><text x="375" y="225">Arrival day</text><text x="625" y="225">First few days</text><text x="875" y="225">Build rhythm</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#3c6965" text-anchor="middle"><text x="125" y="260"><tspan x="125">Shift schedule</tspan><tspan x="125" dy="22">if practical</tspan></text><text x="375" y="260"><tspan x="375">Use local</tspan><tspan x="375" dy="22">meal and sleep times</tspan></text><text x="625" y="260"><tspan x="625">Time light to</tspan><tspan x="625" dy="22">destination clock</tspan></text><text x="875" y="260"><tspan x="875">Keep wake time</tspan><tspan x="875" dy="22">consistent</tspan></text></g><text x="50" y="365" font-family="Arial,sans-serif" font-size="17" fill="#3c6965">Light timing depends on travel direction and time-zone difference.</text></svg>