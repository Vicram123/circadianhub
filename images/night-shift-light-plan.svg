<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">Light planning around a night shift</title><desc id="d">A simplified three-part plan: use brighter light early in the shift when helpful, reduce bright light toward the end if safe and practical, and make the bedroom dark for daytime sleep.</desc><rect width="1000" height="390" rx="24" fill="#f7f8ff"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#28366b">Light planning around a night shift</text><g><rect x="50" y="105" width="280" height="205" rx="18" fill="#fff1c7"/><rect x="360" y="105" width="280" height="205" rx="18" fill="#e5eaf9"/><rect x="670" y="105" width="280" height="205" rx="18" fill="#dce5f2"/></g><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#28366b" text-anchor="middle"><text x="190" y="145">Early shift</text><text x="500" y="145">Toward shift end</text><text x="810" y="145">After shift</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#39486e" text-anchor="middle"><text x="190" y="205"><tspan x="190">Brighter work light</tspan><tspan x="190" dy="25">when appropriate</tspan></text><text x="500" y="205"><tspan x="500">Reduce unnecessary</tspan><tspan x="500" dy="25">bright light if safe</tspan></text><text x="810" y="205"><tspan x="810">Dark, quiet room</tspan><tspan x="810" dy="25">for daytime sleep</tspan></text></g><text x="50" y="350" font-family="Arial,sans-serif" font-size="17" fill="#39486e">Adapt to your roster, commute, safety needs, and personal response.</text></svg>