<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">Illustrative sleep stages across a night</title><desc id="d">A simplified hypnogram showing repeating periods of light sleep, deep sleep and REM sleep. The pattern varies between people and nights.</desc><rect width="1000" height="480" rx="24" fill="#f8fbff"/><text x="60" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183153">Sleep stages across a typical night</text><text x="60" y="88" font-family="Arial,sans-serif" font-size="18" fill="#52657a">Illustrative only — actual sleep patterns vary</text><g stroke="#d5dfeb" stroke-width="2"><path d="M130 140H930M130 220H930M130 300H930M130 380H930"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#334e68"><text x="54" y="146">Awake</text><text x="75" y="226">REM</text><text x="83" y="306">Light</text><text x="83" y="386">Deep</text></g><path d="M130 300H180V380H240V300H300V220H350V300H410V380H460V300H520V220H570V300H630V380H680V300H740V220H790V300H850V220H900V300H930" fill="none" stroke="#3978c5" stroke-width="12" stroke-linejoin="round"/><g font-family="Arial,sans-serif" font-size="18" fill="#52657a" text-anchor="middle"><text x="130" y="430">Bedtime</text><text x="330" y="430">2 h</text><text x="530" y="430">4 h</text><text x="730" y="430">6 h</text><text x="930" y="430">Wake</text></g></svg>