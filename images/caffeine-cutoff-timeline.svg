<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Caffeine timing timeline</title><desc id="d">A practical timeline illustrating that caffeine can remain in the body for hours. A common starting point is to stop caffeine about eight hours before bedtime, adjusting for individual sensitivity.</desc><rect width="1000" height="420" rx="24" fill="#fffaf2"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#563b20">Plan caffeine around bedtime</text><text x="55" y="94" font-family="Arial,sans-serif" font-size="19" fill="#735b43">A starting point, not a medical rule</text><path d="M100 210H900" stroke="#d9c6ad" stroke-width="12" stroke-linecap="round"/><g fill="#b36a26"><circle cx="150" cy="210" r="18"/><circle cx="390" cy="210" r="18"/><circle cx="650" cy="210" r="18"/><circle cx="860" cy="210" r="18"/></g><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#563b20" text-anchor="middle"><text x="150" y="160">Morning</text><text x="390" y="160">Midday</text><text x="650" y="160">Bedtime −8 h</text><text x="860" y="160">Bedtime</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#735b43" text-anchor="middle"><text x="150" y="258">Caffeine, if used</text><text x="390" y="258">Consider your last cup</text><text x="650" y="258">Suggested cutoff</text><text x="860" y="258">Protect sleep</text></g><rect x="55" y="310" width="890" height="64" rx="14" fill="#f4e6d2"/><text x="78" y="349" font-family="Arial,sans-serif" font-size="18" fill="#563b20">Caffeine half-life often averages around 5 hours, but varies widely.</text></svg>